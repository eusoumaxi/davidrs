# Dependency policy, checked by `scripts/check.sh deny` (cargo-deny).

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Permissive licences only, so every dependency can ship inside an MIT crate.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
include-dev = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
