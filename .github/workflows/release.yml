name: Release

# Every main push runs CI. Rust or crate configuration changes then prepare
# a version and publish it; documentation-only changes stop after CI.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    name: Prepare version after CI
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: github.ref_type != 'tag'
        with:
          tool: release-plz,cargo-semver-checks
      - name: Configure release author and Git authentication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - id: version
        run: scripts/prepare-release.sh
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    name: Publish to crates.io
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Check whether this version is already on crates.io
        id: registry
        run: |
          response=$(curl --silent --show-error --output /tmp/registry.json --write-out '%{http_code}' \
            --user-agent "davidrs release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/davidrs/${RELEASE_TAG#v}")
          case "$response" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry lookup failed: HTTP $response" >&2; exit 1 ;;
          esac
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - name: Authenticate with crates.io trusted publishing
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Tag and GitHub release
    needs: [prepare, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Create the release from the changelog
        run: |
          scripts/check.sh release-notes "$RELEASE_TAG" > /tmp/release-notes.md
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "davidrs ${RELEASE_TAG#v}" --notes-file /tmp/release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}

  docs:
    name: Documentation site
    needs: [prepare, crates-io]
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
    permissions:
      contents: read
      pages: write
      id-token: write
