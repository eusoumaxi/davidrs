name: Release

# Pushing a tag `vX.Y.Z` on main publishes that version: the tag, Cargo.toml
# and CHANGELOG.md must agree, CI must pass, then the crate goes to crates.io,
# the changelog section becomes the GitHub release, and the documentation site
# is rebuilt. CONTRIBUTING.md, "Releases", has the maintainer's steps.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Tag, version and changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: scripts/check.sh release "$GITHUB_REF_NAME"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  crates-io:
    name: Publish to crates.io
    needs: [tag, ci]
    runs-on: ubuntu-latest
    # crates.io trusted publishing names this environment; protect it in the
    # repository settings to require an approval before every publish.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether this version is already on crates.io
        id: registry
        run: |
          if curl --silent --fail --output /dev/null \
            --user-agent "davidrs release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/davidrs/${GITHUB_REF_NAME#v}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io trusted publishing
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: crates-io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check.sh release-notes "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "davidrs ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: Documentation site
    needs: crates-io
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
